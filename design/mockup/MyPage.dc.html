<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#FAF8F5; --surface:#FFFFFF; --border:#E6E1D8; --text:#221D18; --text-soft:#7A7267;
      --accent:#D9622B; --accent-dark:#B94F1F; --success-soft:#E7F3EC; --success:#2F7D5C;
      --warn-soft:#FBF0DC; --warn:#B7791F; --muted-soft:#F1EFEA; --muted:#9C9488;
      --radius:10px; --radius-sm:8px; --shadow:0 1px 2px rgba(34,29,24,0.06), 0 1px 1px rgba(34,29,24,0.04);
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;}
    h1,h2,h3,.display{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;}
    a{color:var(--accent);text-decoration:none;}
    button{font-family:inherit;cursor:pointer;}
    .tab-btn{padding:10px 18px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:600;}
    .icon-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-soft);}
    .icon-btn:hover{border-color:var(--accent);color:var(--accent-dark);}
    .list-card{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:12px;}
  </style>
</helmet>

<div style="min-height:1200px;display:flex;">

  <!-- Sidebar -->
  <div style="width:260px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);padding:32px 24px;">
    <div style="width:64px;height:64px;border-radius:999px;background:var(--muted-soft);display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-weight:700;font-size:20px;margin-bottom:16px;">김</div>
    <div style="font-weight:600;font-size:16px;">김민준</div>
    <div style="color:var(--text-soft);font-size:13px;margin-top:2px;">minjun@example.com</div>
    <button style="margin-top:20px;width:100%;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-soft);">로그아웃</button>
  </div>

  <!-- Main -->
  <div style="flex:1;padding:32px 40px;">
    <div style="display:flex;gap:8px;margin-bottom:24px;">
      <button class="tab-btn" style="background:{{listingsBg}};color:{{listingsColor}};" onClick="{{showListings}}">내 매물</button>
      <button class="tab-btn" style="background:{{favBg}};color:{{favColor}};" onClick="{{showFavorites}}">찜 목록</button>
      <button class="tab-btn" style="background:{{chatBg}};color:{{chatColor}};" onClick="{{showChats}}">채팅 목록</button>
    </div>

    <sc-if value="{{tabIsListings}}" hint-placeholder-val="{{true}}">
      <div class="list-card">
        <div style="width:72px;height:56px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#D9622B,#B94F1F);flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">2021 아반떼 CN7 스마트</div>
          <div style="color:var(--text-soft);font-size:13px;margin-top:2px;">1,680만원 · <span style="color:var(--success);font-weight:600;">판매중</span></div>
        </div>
        <button class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
        <button class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
      </div>
      <div class="list-card">
        <div style="width:72px;height:56px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#4C6B5C,#334A3E);flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">2022 K5 3세대 노블레스</div>
          <div style="color:var(--text-soft);font-size:13px;margin-top:2px;">2,290만원 · <span style="color:var(--warn);font-weight:600;">예약중</span></div>
        </div>
        <button class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
        <button class="icon-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
      </div>
    </sc-if>

    <sc-if value="{{tabIsFavorites}}" hint-placeholder-val="{{false}}">
      <div class="list-card">
        <div style="width:72px;height:56px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#8B7B6A,#6B5D4F);flex-shrink:0;"></div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">2019 소나타 DN8 프리미엄</div>
          <div style="color:var(--text-soft);font-size:13px;margin-top:2px;">1,350만원</div>
        </div>
        <button style="padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;color:var(--text-soft);">찜 취소</button>
      </div>
    </sc-if>

    <sc-if value="{{tabIsChats}}" hint-placeholder-val="{{false}}">
      <div class="list-card">
        <div style="width:44px;height:44px;border-radius:999px;background:var(--muted-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-soft);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">2021 아반떼 CN7 스마트 — 1,680만원</div>
          <div style="color:var(--text-soft);font-size:13px;margin-top:2px;">아직 판매중인가요? 오늘 오후에 볼 수 있을까요?</div>
        </div>
        <div style="width:8px;height:8px;border-radius:999px;background:var(--accent);"></div>
      </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'listings' };
  }

  renderVals() {
    const active = '#D9622B';
    const inactive = 'transparent';
    const activeText = '#FFFFFF';
    const inactiveText = '#7A7267';
    const tab = this.state.tab;
    return {
      tabIsListings: tab === 'listings',
      tabIsFavorites: tab === 'favorites',
      tabIsChats: tab === 'chats',
      listingsBg: tab === 'listings' ? active : inactive,
      listingsColor: tab === 'listings' ? activeText : inactiveText,
      favBg: tab === 'favorites' ? active : inactive,
      favColor: tab === 'favorites' ? activeText : inactiveText,
      chatBg: tab === 'chats' ? active : inactive,
      chatColor: tab === 'chats' ? activeText : inactiveText,
      showListings: () => this.setState({ tab: 'listings' }),
      showFavorites: () => this.setState({ tab: 'favorites' }),
      showChats: () => this.setState({ tab: 'chats' }),
    };
  }
}
</script>
</body>
</html>
