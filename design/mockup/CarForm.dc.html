<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#FAF8F5; --surface:#FFFFFF; --border:#E6E1D8; --text:#221D18; --text-soft:#7A7267;
      --accent:#D9622B; --accent-dark:#B94F1F; --muted-soft:#F1EFEA;
      --radius:10px; --radius-sm:8px; --shadow:0 1px 2px rgba(34,29,24,0.06), 0 1px 1px rgba(34,29,24,0.04);
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;}
    h1,h2,h3,.display{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;}
    label{display:block;font-size:13px;font-weight:600;color:var(--text-soft);margin-bottom:6px;}
    .field{margin-bottom:18px;}
    .input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);}
    .input:focus{outline:none;border-color:var(--accent);}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:14px 26px;font-size:15px;font-weight:600;}
    .btn-primary:hover{background:var(--accent-dark);}
    .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 26px;font-size:15px;font-weight:600;}
  </style>
</helmet>

<div style="min-height:1400px;">
  <div style="padding:20px 48px;border-bottom:1px solid var(--border);background:var(--surface);">
    <div class="display" style="font-size:20px;font-weight:700;color:var(--accent);">중고차마당</div>
  </div>

  <div style="max-width:760px;margin:0 auto;padding:40px 24px 60px;">
    <h1 style="font-size:24px;margin:0 0 28px;">매물 등록하기</h1>

    <div class="field">
      <label>매물 사진</label>
      <div style="display:flex;gap:16px;align-items:center;">
        <div style="width:180px;height:130px;border-radius:var(--radius);background:linear-gradient(135deg,#D9622B,#B94F1F);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="2" y="13" width="20" height="5" rx="1.5"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
        </div>
        <div style="border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:20px 24px;flex:1;text-align:center;color:var(--text-soft);font-size:13px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          클릭하거나 파일을 끌어다 놓으세요<br>JPG, PNG (최대 5MB)
        </div>
      </div>
    </div>

    <div class="row2">
      <div class="field"><label>제목</label><input class="input" value="2021 아반떼 CN7 스마트"></div>
      <div class="field"><label>브랜드</label><input class="input" value="현대"></div>
    </div>
    <div class="row2">
      <div class="field"><label>모델명</label><input class="input" value="아반떼"></div>
      <div class="field"><label>연식</label><input class="input" value="2021"></div>
    </div>
    <div class="row2">
      <div class="field"><label>주행거리(km)</label><input class="input" value="32,000"></div>
      <div class="field"><label>가격(원)</label><input class="input" value="16,800,000"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label>연료</label>
        <div class="input" style="display:flex;justify-content:space-between;align-items:center;">가솔린
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-soft)" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="field">
        <label>변속기</label>
        <div class="input" style="display:flex;justify-content:space-between;align-items:center;">자동
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-soft)" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </div>
    <div class="field"><label>지역</label><input class="input" value="서울 강남구"></div>
    <div class="field">
      <label>상세설명</label>
      <textarea class="input" rows="5" style="resize:vertical;">무사고 차량이며 1인 오너 관리 차량입니다. 실내외 상태 매우 양호합니다.</textarea>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
      <button class="btn-ghost">취소</button>
      <button class="btn-primary">등록하기</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
