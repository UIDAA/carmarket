<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#FAF8F5; --surface:#FFFFFF; --border:#E6E1D8; --text:#221D18; --text-soft:#7A7267;
      --accent:#D9622B; --accent-dark:#B94F1F; --accent-soft:#FCEEE4;
      --success:#2F7D5C; --success-soft:#E7F3EC; --muted:#9C9488; --muted-soft:#F1EFEA;
      --radius:10px; --radius-sm:8px; --shadow:0 1px 2px rgba(34,29,24,0.06), 0 1px 1px rgba(34,29,24,0.04);
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;}
    h1,h2,h3,.display{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;}
    a{color:var(--accent);text-decoration:none;}
    a:hover{color:var(--accent-dark);}
    button{font-family:inherit;cursor:pointer;}
    .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:14px 20px;font-size:15px;font-weight:600;width:100%;}
    .btn-primary:hover{background:var(--accent-dark);}
    .btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 20px;font-size:15px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent-dark);}
    .spec-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;}
    .spec-row:last-child{border-bottom:none;}
  </style>
</helmet>

<div style="min-height:1500px;">

  <div style="display:flex;align-items:center;gap:8px;padding:20px 48px;border-bottom:1px solid var(--border);background:var(--surface);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-soft)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    <span style="color:var(--text-soft);font-size:14px;">목록으로</span>
  </div>

  <div style="display:flex;gap:40px;padding:36px 48px;align-items:flex-start;">

    <!-- Left: images -->
    <div style="flex:0 0 620px;">
      <div style="width:100%;height:420px;border-radius:var(--radius);background:linear-gradient(135deg,#D9622B,#B94F1F);display:flex;align-items:center;justify-content:center;">
        <svg width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="2" y="13" width="20" height="5" rx="1.5"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;">
        <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="4">
          <div style="height:88px;border-radius:var(--radius-sm);background:{{t.bg}};border:2px solid {{t.border}};"></div>
        </sc-for>
      </div>

      <div style="margin-top:32px;">
        <h2 style="font-size:18px;margin:0 0 12px;">상세설명</h2>
        <p style="color:var(--text);font-size:14px;line-height:1.7;">
          무사고 차량이며 1인 오너 관리 차량입니다. 정기적인 엔진오일 및 소모품 교체 이력이 있고, 실내외 상태 매우 양호합니다.
          하이패스, 후방카메라, 스마트키 옵션이 포함되어 있으며 직거래 및 안전거래 모두 가능합니다.
        </p>
        <div style="display:flex;align-items:center;gap:8px;margin-top:20px;color:var(--text-soft);font-size:14px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          서울 강남구 인근 (직거래 시 정확한 위치 안내)
        </div>
      </div>
    </div>

    <!-- Right: info panel -->
    <div style="flex:1;">
      <div style="display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--success-soft);color:var(--success);">판매중</div>
      <h1 style="font-size:28px;margin:12px 0 6px;">2021 아반떼 CN7 스마트</h1>
      <div class="display" style="font-size:30px;font-weight:700;color:var(--text);margin-bottom:20px;">1,680만원</div>

      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px 20px;">
        <div class="spec-row"><span style="color:var(--text-soft);">연식</span><span>2021년</span></div>
        <div class="spec-row"><span style="color:var(--text-soft);">주행거리</span><span>3.2만km</span></div>
        <div class="spec-row"><span style="color:var(--text-soft);">연료</span><span>가솔린</span></div>
        <div class="spec-row"><span style="color:var(--text-soft);">변속기</span><span>자동</span></div>
        <div class="spec-row"><span style="color:var(--text-soft);">지역</span><span>서울 강남구</span></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:20px;">
        <button class="btn-ghost" onClick="{{toggleFav}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="{{heartFill}}" stroke="{{heartColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2 4.8 5.6 4.1c2-.4 4 .5 5.4 2.4C12.4 4.6 14.4 3.7 16.4 4.1 20 4.8 21.5 8.4 22 11.7 19.5 16.4 12 21 12 21z"/></svg>
          {{favLabel}}
        </button>
        <button class="btn-primary">문의하기</button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin-top:24px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);">
        <div style="width:44px;height:44px;border-radius:999px;background:var(--muted-soft);display:flex;align-items:center;justify-content:center;color:var(--text-soft);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div>
          <div style="font-weight:600;font-size:14px;">이든자동차</div>
          <div style="color:var(--text-soft);font-size:12px;">응답률 92% · 매물 6건 판매중</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#D9622B"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { favorited: true };
  }

  renderVals() {
    const accent = this.props.accent ?? '#D9622B';
    const favorited = this.state.favorited;
    const thumbs = [
      { bg: 'linear-gradient(135deg,#D9622B,#B94F1F)', border: accent },
      { bg: '#F1EFEA', border: 'transparent' },
      { bg: '#F1EFEA', border: 'transparent' },
      { bg: '#F1EFEA', border: 'transparent' },
    ];
    return {
      accent,
      thumbs,
      heartFill: favorited ? accent : 'none',
      heartColor: favorited ? accent : '#B9AFA0',
      favLabel: favorited ? '찜 취소' : '찜하기',
      toggleFav: () => this.setState({ favorited: !this.state.favorited }),
    };
  }
}
</script>
</body>
</html>
