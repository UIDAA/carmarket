<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg:#FAF8F5; --surface:#FFFFFF; --border:#E6E1D8; --text:#221D18; --text-soft:#7A7267;
      --accent:#D9622B; --accent-dark:#B94F1F; --radius:10px; --radius-sm:8px;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;}
    h1,h2,h3,.display{font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;}
    a{color:var(--accent);text-decoration:none;}
    .bubble{max-width:340px;padding:11px 16px;border-radius:16px;font-size:14px;line-height:1.5;}
    .bubble-them{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;}
    .bubble-me{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
    .time{font-size:11px;color:var(--text-soft);margin-top:4px;}
  </style>
</helmet>

<div style="min-height:900px;display:flex;flex-direction:column;">

  <!-- Top bar -->
  <div style="display:flex;align-items:center;gap:14px;padding:16px 32px;border-bottom:1px solid var(--border);background:var(--surface);">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-soft)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    <div style="width:44px;height:36px;border-radius:6px;background:linear-gradient(135deg,#D9622B,#B94F1F);"></div>
    <div style="flex:1;">
      <div style="font-weight:600;font-size:14px;">2021 아반떼 CN7 스마트</div>
      <div style="color:var(--text-soft);font-size:12px;">판매자: 이든자동차 · 1,680만원</div>
    </div>
    <a href="#" style="font-size:13px;font-weight:600;">매물보기</a>
  </div>

  <!-- Messages -->
  <div style="flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:16px;">
    <div style="display:flex;flex-direction:column;align-items:flex-start;">
      <div class="bubble bubble-them">안녕하세요! 아반떼 매물 문의드려요. 아직 판매중인가요?</div>
      <div class="time">오후 2:14</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;">
      <div class="bubble bubble-me">네 안녕하세요, 아직 판매중입니다 :)</div>
      <div class="time">오후 2:16</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;">
      <div class="bubble bubble-them">혹시 오늘 오후에 실물 보러 가도 될까요?</div>
      <div class="time">오후 2:17</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;">
      <div class="bubble bubble-me">네 가능합니다. 강남구 쪽으로 오시면 될 것 같아요. 몇 시쯤 괜찮으세요?</div>
      <div class="time">오후 2:19</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;">
      <div class="bubble bubble-them">6시쯤 어떠신가요?</div>
      <div class="time">오후 2:20</div>
    </div>
  </div>

  <!-- Input bar -->
  <div style="display:flex;gap:10px;padding:16px 32px;border-top:1px solid var(--border);background:var(--surface);">
    <input class="input" placeholder="메시지를 입력하세요" style="flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:999px;font-size:14px;font-family:inherit;">
    <button style="background:var(--accent);color:#fff;border:none;width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {}
</script>
</body>
</html>
